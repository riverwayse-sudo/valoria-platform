name: Cross-repository migration guard

# Suite 29 (valoria-final/src/__tests__/29_cross_repo_migration_versions.test.js)
# compares this repository's migrations against valoria-site's. It resolves the
# sibling through VALORIA_SITE_DIR, a hardcoded workspace path, then a relative
# path, and *skips* when none exists.
#
# Every job in ci.yml and valoria-platform-tests.yml is a platform-only checkout,
# so the sibling is never present and the guard has never actually run in CI. A
# skipped guard is reported as a pass, which is the failure mode the guard exists
# to prevent. This workflow checks out both repositories so the guard executes.
#
# This is a separate workflow rather than a job in ci.yml because ci.yml triggers
# only on pull requests whose base is main. A job added there does not run on a
# PR stacked on another branch — which is exactly how this guard's own pull
# request is structured. A path-filtered trigger with no base filter runs on any
# pull request that touches migrations, wherever it is based.
#
# No base-branch filter is deliberate. The guard's whole purpose is to compare
# this repository against the sibling, so it must run before either side merges.

on:
  pull_request:
    paths:
      - "valoria-final/src/__tests__/29_cross_repo_migration_versions.test.js"
      - "valoria-final/package.json"
      - "valoria-final/package-lock.json"
      - "supabase/migrations/**"
      - "valoria-final/supabase/migrations/**"
      - ".github/workflows/cross-repo-migration-guard.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "valoria-final/supabase/migrations/**"
      - ".github/workflows/cross-repo-migration-guard.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cross-repo-migration-guard:
    name: Cross-Repo Migration Guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform
        uses: actions/checkout@v4.2.2
        with:
          path: platform
      - name: Check out site
        uses: actions/checkout@v4.2.2
        with:
          repository: riverwayse-sudo/valoria-site
          path: site
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: platform/valoria-final/package-lock.json
      - name: Install dependencies
        working-directory: platform/valoria-final
        run: npm ci
      - name: Run cross-repository migration guard
        working-directory: platform/valoria-final
        env:
          VALORIA_SITE_DIR: ${{ github.workspace }}/site
        run: |
          set +e
          npx jest src/__tests__/29_cross_repo_migration_versions.test.js --runInBand --verbose 2>&1 | tee cross-repo-guard.log
          status=${PIPESTATUS[0]}
          # A silent skip is a false pass. If the guard reports that it could not
          # run, fail the job rather than letting a skipped check look green.
          if grep -q "cross-repository migration guard SKIPPED" cross-repo-guard.log; then
            echo "ERROR: the cross-repository guard skipped; the sibling checkout was not visible."
            exit 1
          fi
          exit "$status"
      - name: Upload guard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-repo-guard-diagnostics-${{ github.run_id }}
          path: platform/valoria-final/cross-repo-guard.log
          if-no-files-found: warn
