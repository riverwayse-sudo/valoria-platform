name: Process Marketplace Readiness Queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process readiness queue
        run: |
          curl -sf "https://valoria-final.vercel.app/api/process-readiness-queue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -o response.json -w "\nHTTP %{http_code}\n"
          cat response.json
