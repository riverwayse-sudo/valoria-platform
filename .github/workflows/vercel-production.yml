name: Deploy Valoria Assessment to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "valoria-final/**"
      - ".github/workflows/vercel-production.yml"
  workflow_dispatch:

concurrency:
  group: valoria-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valoria-final
    env:
      VERCEL_ORG_ID: team_WNHL3GSlhevjZ7WEY9r9ALUw
      VERCEL_PROJECT_ID: prj_mjjA8XoInf4vRcoRXTMTk6MOqemj
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail here, not three steps later. Without this, an unset secret reaches
      # `vercel pull --token="$VERCEL_TOKEN"` as `--token=""`, and the CLI reports
      # "You defined \"--token\", but it's missing a value" — which reads like a
      # syntax problem rather than "the secret was never configured".
      - name: Preflight — deploy credentials are configured
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error title=VERCEL_TOKEN is not configured::Production deploys cannot run. Add the VERCEL_TOKEN repository secret (Vercel → Account Settings → Tokens) via the authorised secret-management process. Do not paste the token into this file."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
