name: Deploy Valoria Assessment to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [migration/cloudflare-workers-adapter]
    paths:
      - "valoria-final/**"
      - ".github/workflows/cloudflare-workers.yml"

permissions:
  contents: read

concurrency:
  group: valoria-assessment-cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valoria-final
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: valoria-final/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run platform tests
        run: npm test -- --runInBand
        env:
          CI: "true"

      - name: Build assessment frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Bundle Worker without deploying
        run: npx --yes wrangler@4.156.0 deploy --dry-run

      - name: Validate deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VALU_SITE_ORIGIN: ${{ secrets.VALU_SITE_ORIGIN }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY RESEND_API_KEY ANTHROPIC_API_KEY CRON_SECRET VALU_SITE_ORIGIN; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $key"
              exit 1
            fi
          done
          test -f dist/index.html
          test -f worker.js
          test -f wrangler.jsonc

      - name: Deploy Worker and capture workers.dev URL
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 deploy 2>&1 | tee deploy.log
          worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)"
          if [ -z "$worker_url" ]; then
            echo "::error::Deployment succeeded but Wrangler did not print a workers.dev URL. Retrieve it from Cloudflare Workers dashboard."
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "Assessment Worker deployed at $worker_url"

      - name: Configure Cloudflare Worker secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VALU_SITE_ORIGIN: ${{ secrets.VALU_SITE_ORIGIN }}
          SITE_ORIGIN: ${{ secrets.SITE_ORIGIN || secrets.VALU_SITE_ORIGIN }}
          VALORIA_SITE_URL: ${{ secrets.VALORIA_SITE_URL || secrets.VALU_SITE_ORIGIN }}
          VALU_PRODUCTION_SUPABASE_URL: ${{ secrets.VALU_PRODUCTION_SUPABASE_URL || secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          set -euo pipefail
          for key in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY RESEND_API_KEY ANTHROPIC_API_KEY CRON_SECRET VALU_SITE_ORIGIN SITE_ORIGIN VALORIA_SITE_URL VALU_PRODUCTION_SUPABASE_URL BREVO_API_KEY; do
            value="${!key:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4.156.0 secret put "$key" --name valoria-assessment
            fi
          done

      - name: Smoke test deployed Worker
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          html_status="$(curl --silent --show-error --output assessment.html --write-out "%{http_code}" "$WORKER_URL/valu/assessment/")"
          if [ "$html_status" != "200" ]; then
            echo "::error::Assessment HTML route returned HTTP $html_status"
            head -c 1200 assessment.html || true
            exit 1
          fi

          if ! grep -q '/valu/assessment/assets/' assessment.html; then
            echo "::error::Assessment HTML did not reference the expected /valu/assessment/assets/ base path"
            head -c 2000 assessment.html
            exit 1
          fi
          asset_path="$(grep -Eo '/valu/assessment/assets/[^" ]+\.(js|css)' assessment.html | head -n 1)"
          if [ -z "$asset_path" ]; then
            echo "::error::No JavaScript or CSS asset path was found in the assessment HTML"
            exit 1
          fi
          asset_status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "$WORKER_URL$asset_path")"
          if [ "$asset_status" != "200" ]; then
            echo "::error::Assessment asset $asset_path returned HTTP $asset_status"
            exit 1
          fi
          echo "Assessment HTML and asset route returned HTTP 200."

          health_status="$(curl --silent --show-error --output system-status.json --write-out "%{http_code}" "$WORKER_URL/api/system-status" --header "Authorization: Bearer $CRON_SECRET")"
          if [ "$health_status" != "200" ]; then
            echo "::error::Protected system-status endpoint returned HTTP $health_status"
            cat system-status.json || true
            exit 1
          fi
          node -e "const r=require('./system-status.json'); if(!('backlog' in r)) { console.error('Missing backlog object'); process.exit(1); } console.log('Protected Worker health endpoint responded; backlog total:', r.backlog.total)"
