name: Deploy Valoria Assessment to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [migration/cloudflare-workers-adapter]
    paths:
      - "valoria-final/**"
      - ".github/workflows/cloudflare-workers.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valoria-final
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: valoria-final/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build assessment frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Deploy Worker
        run: npx --yes wrangler@4.68.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure Worker secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VALU_SITE_ORIGIN: ${{ secrets.VALU_SITE_ORIGIN }}
          VALU_PRODUCTION_SUPABASE_URL: ${{ secrets.VALU_PRODUCTION_SUPABASE_URL }}
        run: |
          set -euo pipefail
          for key in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY RESEND_API_KEY ANTHROPIC_API_KEY CRON_SECRET VALU_SITE_ORIGIN VALU_PRODUCTION_SUPABASE_URL; do
            value="${!key:-}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx --yes wrangler@4.68.0 secret put "$key" --name valoria-assessment; fi
          done
