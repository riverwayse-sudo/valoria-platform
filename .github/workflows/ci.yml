# Valoria CI — platform repository
name: Valoria CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: valoria-final

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: valoria-final/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        shell: bash
        run: |
          set +e
          npm test -- --runInBand --verbose 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          exit "$status"
        env:
          CI: true
      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics-${{ github.run_id }}
          path: valoria-final/test-output.log
          if-no-files-found: warn

  # The cross-repository migration guard in suite 29 compares this repository's
  # migrations against valoria-site's. It skips silently when the sibling repo is
  # absent, which is the case in every other job here — so the guard that caught
  # the divergent 20260921123000 migration has never actually run in CI. This job
  # checks out both repositories and sets VALORIA_SITE_DIR so the guard executes.
  #
  # It is intentionally its own job: the sibling checkout is a different
  # repository, and adding it to unit-tests would change what that job means.
  #
  # Expected result while the coordinated fix is in flight: this job checks out
  # the sibling at its default branch. Until the site's copy of
  # 20260921123000_canonical_lead_pipeline.sql carries the same dollar-quote fix
  # as this repository's, the guard reports a genuine harmful divergence and this
  # job fails. That red result is the coupling between the two pull requests made
  # visible and enforced, rather than left to a note in a document. It goes green
  # when both repositories carry the coordinated fix.
  cross-repo-migration-guard:
    name: Cross-Repo Migration Guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform
        uses: actions/checkout@v4.2.2
        with:
          path: platform
      - name: Check out site
        uses: actions/checkout@v4.2.2
        with:
          repository: riverwayse-sudo/valoria-site
          path: site
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: platform/valoria-final/package-lock.json
      - name: Install dependencies
        working-directory: platform/valoria-final
        run: npm ci
      - name: Run cross-repository migration guard
        working-directory: platform/valoria-final
        env:
          VALORIA_SITE_DIR: ${{ github.workspace }}/site
        run: |
          set +e
          npx jest src/__tests__/29_cross_repo_migration_versions.test.js --runInBand --verbose 2>&1 | tee cross-repo-guard.log
          status=${PIPESTATUS[0]}
          # A silent skip is a false pass. Fail the job if the guard reported
          # that it could not run.
          if grep -q "cross-repository migration guard SKIPPED" cross-repo-guard.log; then
            echo "ERROR: the cross-repository guard skipped; the sibling checkout was not visible."
            exit 1
          fi
          exit "$status"
      - name: Upload guard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-repo-guard-diagnostics-${{ github.run_id }}
          path: platform/valoria-final/cross-repo-guard.log
          if-no-files-found: warn

  build-check:
    name: Production Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: valoria-final/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Create CI-only build environment
        run: |
          printf '%s\n' \
            'VITE_SUPABASE_URL=https://placeholder.supabase.co' \
            'VITE_SUPABASE_ANON_KEY=placeholder_key' \
            > .env
      - name: Run production build
        run: npm run build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
      - name: Verify asset serving and routing against the built artifact
        run: npm run verify:build
        env:
          CI: true

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-parity:
    name: Env Var Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Check .env.example exists
        run: |
          test -f .env.example || { echo 'ERROR: valoria-final/.env.example is missing.'; exit 1; }
      - name: Verify no .env file committed
        run: |
          test ! -f .env || { echo 'ERROR: valoria-final/.env file is committed to the repo.'; exit 1; }
      - name: Check required env keys present in .env.example
        run: |
          REQUIRED='VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY'
          for KEY in $REQUIRED; do
            grep -q "^${KEY}=" .env.example || { echo "ERROR: ${KEY} is missing from .env.example"; exit 1; }
            echo "${KEY} documented ✓"
          done

  verifiers:
    name: Deterministic Verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: valoria-final/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic verifiers
        # These check properties a unit test cannot: that the deployment rewrites
        # actually serve the built assets, that the submission constraint holds
        # under real concurrent connections, that the schema-rollback behaviour
        # behind the largest block of migration failures is as diagnosed, and that
        # the block-scope bug class has not returned. Each starts a real
        # PostgreSQL and needs no credentials, so they run on every commit.
        run: npm run verify:ci
        env:
          CI: true

