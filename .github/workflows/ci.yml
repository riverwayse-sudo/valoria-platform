# Valoria CI — platform repository
name: Valoria CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: valoria-final

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: valoria-final/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate patched Vite lock candidate
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.devDependencies.vite='6.4.5'; p.devDependencies['@vitejs/plugin-react']='4.3.4'; fs.writeFileSync('package.json', JSON.stringify(p,null,2));"
          npm install --package-lock-only --ignore-scripts
          npm update --package-lock-only --ignore-scripts baseline-browser-mapping brace-expansion browserslist js-yaml nanoid source-map-js postcss esbuild
      - name: Upload patched Vite candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-vite-patch-${{ github.run_id }}
          path: |
            valoria-final/package.json
            valoria-final/package-lock.json
          if-no-files-found: warn
      - name: Install patched dependency lock
        run: npm ci
      - name: Generate dependency audit report
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); console.log('Dependency audit:', JSON.stringify(r.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(r.vulnerabilities || {})) console.log(name + ': ' + item.severity + '; fix=' + JSON.stringify(item.fixAvailable));"
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-dependency-audit-${{ github.run_id }}
          path: valoria-final/npm-audit.json
          if-no-files-found: warn
      - name: Run unit tests
        shell: bash
        run: |
          set +e
          npm test -- --runInBand --verbose 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          exit "$status"
        env:
          CI: true
      - name: Build with patched dependencies
        run: npm run build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
      - name: Commit patched dependency manifests to this PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/assessment-handoff-token-verification-v2'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          cp package.json /tmp/valoria-platform-package.json
          cp package-lock.json /tmp/valoria-platform-package-lock.json
          git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout -f -B "${BRANCH}" "refs/remotes/origin/${BRANCH}"
          cp /tmp/valoria-platform-package.json package.json
          cp /tmp/valoria-platform-package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: patch vulnerable platform dependencies"
            git push origin "HEAD:${BRANCH}"
          fi
      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics-${{ github.run_id }}
          path: valoria-final/test-output.log
          if-no-files-found: warn

  build-check:
    name: Production Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: valoria-final/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Create CI-only build environment
        run: |
          printf '%s\n' \
            'VITE_SUPABASE_URL=https://placeholder.supabase.co' \
            'VITE_SUPABASE_ANON_KEY=placeholder_key' \
            > .env
      - name: Run production build
        run: npm run build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-parity:
    name: Env Var Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Check .env.example exists
        run: |
          test -f .env.example || { echo 'ERROR: valoria-final/.env.example is missing.'; exit 1; }
      - name: Verify no .env file committed
        run: |
          test ! -f .env || { echo 'ERROR: valoria-final/.env file is committed to the repo.'; exit 1; }
      - name: Check required env keys present in .env.example
        run: |
          REQUIRED='VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY'
          for KEY in $REQUIRED; do
            grep -q "^${KEY}=" .env.example || { echo "ERROR: ${KEY} is missing from .env.example"; exit 1; }
            echo "${KEY} documented ✓"
          done
