# Valoria CI — platform repository
name: Valoria CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI should be read-only unless a job explicitly needs more.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
        env:
          CI: true

  build-check:
    name: Production Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Create CI-only build environment
        run: |
          printf '%s\n' \
            'VITE_SUPABASE_URL=https://placeholder.supabase.co' \
            'VITE_SUPABASE_ANON_KEY=placeholder_key' \
            > .env
      - name: Run production build
        run: npm run build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      # Pin the scanner to a reviewed release rather than a floating major tag.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-parity:
    name: Env Var Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Check .env.example exists
        run: |
          test -f .env.example || { echo 'ERROR: .env.example is missing.'; exit 1; }
      - name: Verify no .env file committed
        run: |
          test ! -f .env || { echo 'ERROR: .env file is committed to the repo.'; exit 1; }
      - name: Check required env keys present in .env.example
        run: |
          REQUIRED='VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY'
          for KEY in $REQUIRED; do
            grep -q "^${KEY}=" .env.example || { echo "ERROR: ${KEY} is missing from .env.example"; exit 1; }
            echo "${KEY} documented ✓"
          done
