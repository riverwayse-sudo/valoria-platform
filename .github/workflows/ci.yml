name: Valoria Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The runnable Vite application lives under valoria-final/.
defaults:
  run:
    working-directory: valoria-final

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: valoria-final/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
        env:
          CI: true

  build-check:
    name: Production Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: valoria-final/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Create .env for build
        run: |
          printf '%s\n' \
            'VITE_SUPABASE_URL=https://placeholder.supabase.co' \
            'VITE_SUPABASE_ANON_KEY=placeholder_key' \
            > .env
      - name: Run production build
        run: npm run build
        env:
          CI: true
          NODE_ENV: production

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-parity:
    name: Env Var Parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valoria-final
    steps:
      - uses: actions/checkout@v4
      - name: Check .env.example exists
        run: test -f .env.example
      - name: Verify no .env file committed
        run: |
          if [ -f .env ]; then
            echo 'ERROR: .env file is committed to the repo.'
            exit 1
          fi
      - name: Check required env keys
        run: |
          REQUIRED='VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY ANTHROPIC_API_KEY RESEND_API_KEY'
          for KEY in $REQUIRED; do
            if ! grep -q "^${KEY}=" .env.example; then
              echo "ERROR: ${KEY} is missing from .env.example"
              exit 1
            fi
          done
          echo 'Environment variable contract verified.'
