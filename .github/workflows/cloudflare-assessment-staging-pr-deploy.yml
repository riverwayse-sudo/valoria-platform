name: Deploy approved Valoria assessment PR to isolated Cloudflare staging

on:
  pull_request:
    branches:
      - experience/staging-redesign-20261106
    types: [opened, synchronize, reopened]
    paths:
      - "valoria-final/api/**"
      - "valoria-final/lib/**"
      - "valoria-final/src/**"
      - "valoria-final/worker-tests/**"
      - "valoria-final/worker.js"
      - "valoria-final/wrangler.jsonc"
      - "valoria-final/package.json"
      - "valoria-final/package-lock.json"

permissions:
  contents: read

concurrency:
  group: valoria-assessment-staging-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'deploy/staging-') }}
    name: Test, build, deploy and smoke-test isolated assessment Worker
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: valoria-final
    steps:
      - name: Check out the PR merge result
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: valoria-final/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test Worker routing and response adapters
        run: node --test ./worker-tests/cloudflare-worker.node.mjs

      - name: Run platform unit tests
        run: npm test -- --runInBand

      - name: Build the formal assessment against the isolated staging API
        run: npm run build
        env:
          CI: true
          VITE_VALU_PREVIEW: "0"
          VITE_VALU_API_ORIGIN: "https://valoria-staging-assessment.riverwayse.workers.dev"
          VITE_VALU_SITE_ORIGIN: "https://valoria-staging-site.riverwayse.workers.dev"

      - name: Validate Cloudflare deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare staging deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy only the isolated staging assessment Worker
        run: npx --yes wrangler@4.156.0 deploy --config wrangler.jsonc --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test assessment entry and site-origin CORS
        shell: bash
        run: |
          set -euo pipefail
          base="https://valoria-staging-assessment.riverwayse.workers.dev"
          curl -fsSL --retry 4 --retry-all-errors --max-time 25 "$base/remaining" -o /tmp/valu-assessment-entry.html
          grep -q 'VALU' /tmp/valu-assessment-entry.html
          status="$(curl -sS -o /tmp/valu-cors-response -w '%{http_code}' -X OPTIONS "$base/api/taster-progress" \
            -H 'Origin: https://valoria-staging-site.riverwayse.workers.dev' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,idempotency-key')"
          if [[ "$status" != "204" ]]; then
            echo "Assessment API CORS preflight returned HTTP $status"
            cat /tmp/valu-cors-response || true
            exit 1
          fi
