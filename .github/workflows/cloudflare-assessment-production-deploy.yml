name: Deploy Valoria assessment Worker to Cloudflare production

on:
  push:
    branches:
      - main
    paths:
      - 'valoria-final/**'
      - '.github/workflows/cloudflare-assessment-production-deploy.yml'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to authorize the production Worker release after database migrations are verified."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: valoria-assessment-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'DEPLOY') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]')) }}
    name: Test, build, deploy and smoke-test production assessment Worker
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: valoria-final
    steps:
      - name: Check out the approved release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: valoria-final/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test Worker routing and response adapters
        run: node --test ./worker-tests/cloudflare-worker.node.mjs

      - name: Run platform unit tests
        run: npm test -- --runInBand

      - name: Build production assessment assets
        run: npm run build
        env:
          CI: true
          VITE_VALU_PREVIEW: "0"
          VITE_VALU_API_ORIGIN: "https://assessment.valoriainstitute.com"
          VITE_VALU_SITE_ORIGIN: "https://valoriainstitute.com"

      - name: Validate production deployment credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production assessment Worker
        run: npx --yes wrangler@4.156.0 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test production assessment routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://valoriainstitute.com"
          api_base="https://assessment.valoriainstitute.com"
          # The public SPA is served from the site origin, while API handlers
          # are registered at the root of the dedicated assessment Worker.
          # Keep the two origins explicit so the smoke test matches API_BASE
          # in VALUIndexV4GateNext.jsx and the Worker route table.
          # This is a Vite SPA. curl sees the static shell, not text rendered
          # later by React hydration; validate the shell and its real built assets
          # instead of grepping for client-rendered headings and buttons.
          for route in "/valu/assessment"; do
            slug="$(printf '%s' "$route" | tr '/.' '__')"
            html="/tmp/valu-production-entry-${slug}.html"
            curl -fsSL --retry 4 --retry-all-errors --max-time 25 "$base$route" -o "$html"
            grep -q 'id="root"' "$html"
            grep -q 'Valoria Platform' "$html"
            asset="$(grep -oE 'src="/valu/assessment/assets/[^"]+\.js"' "$html" | head -n1 | cut -d '"' -f2)"
            if [[ -z "$asset" ]]; then
              echo "Assessment route $route did not expose its built JavaScript asset."
              exit 1
            fi
            curl -fsSL --retry 4 --retry-all-errors --max-time 25 "$base$asset" -o /dev/null
          done
          for spec in "GET /api/process-readiness-queue" "POST /api/sweep-unsent-reports"; do
            method="${spec%% *}"
            route="${spec#* }"
            status="$(curl -sS -o /tmp/valu-production-cron-response -w '%{http_code}' -X "$method" "$api_base$route")"
            if [[ "$status" != "401" ]]; then
              echo "Expected unauthenticated cron route $route to return 401; got HTTP $status"
              cat /tmp/valu-production-cron-response || true
              exit 1
            fi
          done
