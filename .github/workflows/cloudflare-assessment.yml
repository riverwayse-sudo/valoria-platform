name: Deploy Valoria Assessment Worker

on:
  push:
    branches:
      - migration/cloudflare-workers-adapter
    paths:
      - "valoria-final/**"
      - ".github/workflows/cloudflare-assessment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-assessment-worker
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valoria-final
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: valoria-final/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run platform tests
        run: npm test -- --runInBand
        env:
          CI: "true"

      - name: Build Vite application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify Worker configuration
        run: |
          test -f worker.js
          test -f wrangler.jsonc
          test -f dist/index.html
          grep -q 'nodejs_compat' wrangler.jsonc

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: valoria-final
          command: deploy
